# Checks every pull request and every push to main: type-check, unit tests, then build the
# main, preload and renderer bundles. Runs on Linux (fast to start, free on a
# public repo); packaging the macOS .dmg is left to release.yml.
#
# CI never talks to Claude: there is no subscription login here, and NateBot
# must never be given an API key. Anything that would spawn `claude` is mocked.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nothing here launches Electron, so skip its ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
