# Packaging for NateBot.app + .dmg. Run: npm run dist
appId: com.nathan.natebot
productName: NateBot
copyright: Personal use
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
# The Apple connector runs as a plain script (outside the archive) under ELECTRON_RUN_AS_NODE.
asarUnpack:
  - resources/apple-mcp.cjs
protocols:
  - name: NateBot
    schemes: [natebot]
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
  # No paid Apple Developer account: ad-hoc sign (first launch needs right-click → Open).
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSUserNotificationAlertStyle: alert
    NSAppleEventsUsageDescription: NateBot reads and, with your approval, adds Apple Reminders and Notes for your agents.
dmg:
  title: NateBot
  artifactName: NateBot-${version}-${arch}.dmg
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }
  window:
    width: 540
    height: 380
