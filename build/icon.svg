<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="0.55" stop-color="#6A5CFF"/>
      <stop offset="1" stop-color="#A24CF5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px tile centred on a 1024 canvas -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  </g>

  <g filter="url(#shadow)">
    <!-- antenna -->
    <line x1="512" y1="330" x2="512" y2="246" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
    <circle cx="512" cy="222" r="44" fill="#FFC83D"/>
    <circle cx="498" cy="206" r="12" fill="#FFFFFF" opacity="0.7"/>

    <!-- speech bubble with tail -->
    <path d="M 332 690 L 284 800 L 440 730 Z" fill="url(#bubble)" stroke="url(#bubble)" stroke-width="24" stroke-linejoin="round"/>
    <rect x="222" y="318" width="580" height="426" rx="196" fill="url(#bubble)"/>
  </g>

  <!-- face -->
  <ellipse cx="418" cy="504" rx="50" ry="58" fill="#1D2250"/>
  <ellipse cx="606" cy="504" rx="50" ry="58" fill="#1D2250"/>
  <circle cx="436" cy="484" r="16" fill="#FFFFFF"/>
  <circle cx="624" cy="484" r="16" fill="#FFFFFF"/>
  <circle cx="340" cy="596" r="30" fill="#FF7AA8" opacity="0.55"/>
  <circle cx="684" cy="596" r="30" fill="#FF7AA8" opacity="0.55"/>
  <path d="M 442 606 Q 512 668 582 606" fill="none" stroke="#1D2250" stroke-width="30" stroke-linecap="round"/>
</svg>
