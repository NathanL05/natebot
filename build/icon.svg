<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- NateBot app icon: a chat-bubble bot head with an antenna on a black tile,
       in brushed white-to-silver metal (Cursor-style). The eyes are cut-outs,
       so the tile shows through. macOS grid: 824px tile on a 1024 canvas. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26262A"/>
      <stop offset="0.45" stop-color="#0D0D0F"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="210" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#ECEEF2"/>
      <stop offset="0.72" stop-color="#BCC1CA"/>
      <stop offset="1" stop-color="#868C98"/>
    </linearGradient>
    <linearGradient id="sheen" x1="262" y1="318" x2="620" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="face">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="400" y="440" width="68" height="124" rx="34" fill="#000"/>
      <rect x="556" y="440" width="68" height="124" rx="34" fill="#000"/>
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <g filter="url(#drop)">
    <g mask="url(#face)" fill="url(#metal)">
      <!-- antenna -->
      <circle cx="512" cy="248" r="38"/>
      <rect x="496" y="260" width="32" height="80" rx="16"/>
      <!-- head: rounded bubble with a tail at the bottom left -->
      <rect x="262" y="318" width="500" height="390" rx="150"/>
      <path d="M318 640 L292 790 L452 690 Z" stroke="url(#metal)" stroke-width="28" stroke-linejoin="round"/>
    </g>
    <!-- top-left sheen on the head -->
    <rect x="262" y="318" width="500" height="390" rx="150" fill="url(#sheen)" mask="url(#face)"/>
  </g>
</svg>
