<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- NateBot app icon: a crew of agent mascots (same style as the in-app
       avatars). macOS grid: 824px tile centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3270"/>
      <stop offset="1" stop-color="#14163A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3A6FF"/>
      <stop offset="1" stop-color="#7B4DF2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCB6B"/>
      <stop offset="1" stop-color="#F09A18"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8DB9"/>
      <stop offset="1" stop-color="#F0467F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- amber hexagon, upper left -->
    <g transform="rotate(-16 330 360)" filter="url(#drop)">
      <path d="M330 222 L450 291 L450 429 L330 498 L210 429 L210 291 Z" fill="url(#amber)" stroke="url(#amber)" stroke-width="48" stroke-linejoin="round"/>
      <circle cx="296" cy="352" r="19" fill="#FFFFFF"/>
      <circle cx="364" cy="352" r="19" fill="#FFFFFF"/>
    </g>

    <!-- pink rounded triangle, right -->
    <g transform="rotate(12 706 420)" filter="url(#drop)">
      <path d="M706 300 L806 482 L606 482 Z" fill="url(#pink)" stroke="url(#pink)" stroke-width="56" stroke-linejoin="round"/>
      <path d="M666 432 Q682 414 698 432" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
      <path d="M714 432 Q730 414 746 432" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    </g>

    <!-- NateBot: violet blob, front and centre -->
    <g filter="url(#drop)">
      <path d="M508 408 C664 400 788 500 790 650 C792 800 664 888 506 886 C350 884 228 790 234 644 C240 500 356 416 508 408 Z" fill="url(#violet)"/>
    </g>
    <ellipse cx="438" cy="628" rx="38" ry="60" fill="#FFFFFF"/>
    <ellipse cx="586" cy="628" rx="38" ry="60" fill="#FFFFFF"/>
    <ellipse cx="362" cy="716" rx="38" ry="21" fill="#FFB3CF" opacity="0.7"/>
    <ellipse cx="662" cy="716" rx="38" ry="21" fill="#FFB3CF" opacity="0.7"/>
    <path d="M474 724 Q512 760 550 724" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  </g>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
</svg>
